  /v1/search:
    post:
      consumes:
      - application/json
      description: 'Embeds the query, runs ANN search over the tenant''s vector collection,
        and resolves hits back to reports. When types includes "kb" and Memgraph is
        enabled, each hit''s classification symptom is used as a graph anchor to pull
        related knowledge articles. graph_anchors reports how many distinct symptoms
        were resolved: zero means the tenant has no classification rows, so the graph
        leg cannot return anything.'
      parameters:
      - description: Bearer <RS256 service JWT>
        in: header
        name: Authorization
        required: true
        type: string
      - description: Tenant ID
        in: header
        name: X-Tenant-Id
        required: true
        type: string
      - description: Request budget in milliseconds; Go runs within this minus headroom,
          falling back to server config when absent
        in: header
        name: X-Timeout-Ms
        type: string
      - description: Search request; types defaults to [report, kb], limit 1-50
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_my_app_internal_application_dto.SearchRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_my_app_internal_transport_http_response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/github_com_my_app_internal_application_dto.SearchResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_my_app_internal_transport_http_response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_my_app_internal_transport_http_response.Envelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_my_app_internal_transport_http_response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_my_app_internal_transport_http_response.Envelope'
      summary: Semantic search over reports and knowledge articles
      tags:
      - search
