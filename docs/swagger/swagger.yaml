info:
  contact: {}
  description: Internal AI service for tenancy-scoped support retrieval and reply
    workflows.
  title: Centric RAG AI Service
  version: 0.1.0
paths:
  /healthz:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Health check
      tags:
      - system
  /internal/review-queue:
    post:
      consumes:
      - application/json
      description: Laravel internal endpoint used by the Go review outbox. `X-AI-Signature`
        is lowercase hex HMAC-SHA256 over `<timestamp>.<raw JSON body>` using `GO_AI_WEBHOOK_SECRET`.
      parameters:
      - description: Unix seconds timestamp, accepted within GO_AI_WEBHOOK_TOLERANCE
        in: header
        name: X-AI-Timestamp
        required: true
        type: string
      - description: Lowercase hex HMAC-SHA256 of '<timestamp>.<raw body>'
        in: header
        name: X-AI-Signature
        required: true
        type: string
      - description: Review queue callback
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/scripts_swagger.reviewQueueCallbackRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Existing idempotent review item
          schema:
            $ref: '#/definitions/scripts_swagger.reviewQueueCallbackResponse'
        "201":
          description: Created review queue item
          schema:
            $ref: '#/definitions/scripts_swagger.reviewQueueCallbackResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_my_app_internal_transport_http_response.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_my_app_internal_transport_http_response.Envelope'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/github_com_my_app_internal_transport_http_response.Envelope'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/github_com_my_app_internal_transport_http_response.Envelope'
      summary: Receive signed Laravel review queue callback
      tags:
      - laravel-callbacks
  /v1/admin/review-queue/{id}/approve:
    post:
      description: Promotes the review queue item into its target (symptom node, subject,
        or KB article).
      parameters:
      - description: Bearer <RS256 service JWT>
        in: header
        name: Authorization
        required: true
        type: string
      - description: Tenant ID
        in: header
        name: X-Tenant-Id
        required: true
        type: string
      - description: Review item ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/scripts_swagger.reviewApproveResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_my_app_internal_transport_http_response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_my_app_internal_transport_http_response.Envelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_my_app_internal_transport_http_response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_my_app_internal_transport_http_response.Envelope'
      summary: Approve review queue item
      tags:
      - review-queue
  /v1/admin/review-queue/{id}/reject:
    post:
      consumes:
      - application/json
      parameters:
      - description: Bearer <RS256 service JWT>
        in: header
        name: Authorization
        required: true
        type: string
      - description: Tenant ID
        in: header
        name: X-Tenant-Id
        required: true
        type: string
      - description: Review item ID
        in: path
        name: id
        required: true
        type: integer
      - description: Review rejection
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/scripts_swagger.reviewRejectRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_my_app_internal_transport_http_response.Envelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_my_app_internal_transport_http_response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_my_app_internal_transport_http_response.Envelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_my_app_internal_transport_http_response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_my_app_internal_transport_http_response.Envelope'
      summary: Reject review queue item
      tags:
      - review-queue
  /v1/chat:
    post:
      consumes:
      - application/json
      description: Runs the tenant-scoped chat workflow. Set debug=true to include
        stage_timings_ms for fast_guard, router, cache, knowledge, render, resolve,
        generate, parse, and store_cache.
      parameters:
      - description: Bearer <RS256 service JWT>
        in: header
        name: Authorization
        required: true
        type: string
      - description: Tenant ID
        in: header
        name: X-Tenant-Id
        required: true
        type: string
      - description: Request budget in milliseconds; Go runs within this minus headroom,
          falling back to server config when absent
        in: header
        name: X-Timeout-Ms
        type: string
      - description: Chat request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_my_app_internal_application_dto.ChatRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_my_app_internal_transport_http_response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/github_com_my_app_internal_application_dto.ChatResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_my_app_internal_transport_http_response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_my_app_internal_transport_http_response.Envelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_my_app_internal_transport_http_response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_my_app_internal_transport_http_response.Envelope'
      summary: Create chat turn
      tags:
      - chat
  /v1/chat/confirm-action:
    post:
      consumes:
      - application/json
      description: Executes an action previously proposed via `pending_action` in
        a /v1/chat or /v1/chat/stream response. `action_id` is the 32-character id
        from that field.
      parameters:
      - description: Bearer <RS256 service JWT>
        in: header
        name: Authorization
        required: true
        type: string
      - description: Tenant ID
        in: header
        name: X-Tenant-Id
        required: true
        type: string
      - description: Confirm request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_my_app_internal_application_dto.ChatConfirmRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_my_app_internal_transport_http_response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/github_com_my_app_internal_application_dto.ChatResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_my_app_internal_transport_http_response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_my_app_internal_transport_http_response.Envelope'
      summary: Confirm a pending chat action
      tags:
      - chat
  /v1/chat/stream:
    post:
      consumes:
      - application/json
      description: 'Server-Sent Events variant of /v1/chat. Each frame is `event:
        <type>\ndata: <json>`; types are start, token, tool, pending_action, done,
        error. Same request body and stage set as /v1/chat.'
      parameters:
      - description: Bearer <RS256 service JWT>
        in: header
        name: Authorization
        required: true
        type: string
      - description: Tenant ID
        in: header
        name: X-Tenant-Id
        required: true
        type: string
      - description: Request budget in milliseconds; Go runs within this minus headroom,
          falling back to server config when absent
        in: header
        name: X-Timeout-Ms
        type: string
      - description: Chat request
        in: body
        name: request
