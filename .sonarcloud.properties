sonar.issue.ignore.multicriteria=swaggerstubs,txwrapper,jwtrs256

# scripts/swagger/api.go holds empty functions that exist only to carry swaggo
# @Router annotations. Empty is the design, not an omission.
sonar.issue.ignore.multicriteria.swaggerstubs.ruleKey=go:S1186
sonar.issue.ignore.multicriteria.swaggerstubs.resourceKey=scripts/swagger/api.go

# Router.BeginTx is a wrapper that returns the transaction to its caller.
# A defer tx.Rollback() there would abort every transaction on return. All four
# real call sites (kb/mysql/bootstrap.go, kb/mysql/knowledge_gap.go,
# kb/mysql/vector_index.go, reports/mysql/promote.go) do defer rollback.
sonar.issue.ignore.multicriteria.txwrapper.ruleKey=godre:S8168
sonar.issue.ignore.multicriteria.txwrapper.resourceKey=internal/infra/tenant/tenant.go

# rsa.VerifyPKCS1v15 is signature verification, not encryption; the rule targets
# PKCS#1 v1.5 encryption padding. RS256 is RSASSA-PKCS1-v1_5 per RFC 7518 3.3 and
# Laravel signs RS256, so this is the required algorithm, not a weak choice.
sonar.issue.ignore.multicriteria.jwtrs256.ruleKey=go:S5542
sonar.issue.ignore.multicriteria.jwtrs256.resourceKey=internal/shared/servicejwt/servicejwt.go
