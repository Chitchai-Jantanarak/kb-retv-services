[project]
name = "guard-embedder"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "model2vec>=0.3",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "tokenizers>=0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/guard_embedder"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[dependency-groups]
dev = ["ruff>=0.6"]
